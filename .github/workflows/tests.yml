name: Application and ClickHouse tests
on:
  push:
    branches: [work, dev, main, 'feat/**']
  pull_request:
    branches: [work, dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
        env:
          CLICKHOUSE_USER: hypothesis_test
          CLICKHOUSE_PASSWORD: local-test-only
        ports:
          - 18123:8123
        options: >-
          --cpus=2 --memory=2g
          --health-cmd "clickhouse-client --user hypothesis_test --password local-test-only --query 'SELECT 1'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          LOCAL_CLICKHOUSE_TEST: '1'
